# alembic.ini — Alembic database migration configuration.
#
# Run migrations:
#   alembic upgrade head
#
# Generate a new migration:
#   alembic revision --autogenerate -m "describe your change"
#
# Rollback one step:
#   alembic downgrade -1

[alembic]
# Path to migration scripts directory (relative to this file)
script_location = alembic

# Template for new revision filenames.
# %(year)d %(month).2d %(day).2d %(hour).2d %(minute).2d %(second).2d = datestamp
# %(rev)s = revision id  %(slug)s = short description
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# sys.path entries for env.py to locate application modules
prepend_sys_path = .

# Timezone for the revision date in filenames
timezone = UTC

# Truncate the revision slug to this length
truncate_slug_length = 40

# Whether to generate REVISION_ID_REVERSE_LOOKUP lookup in env.py
revision_environment = false

# If true, run the env.py in offline mode by default
# (Useful for generating SQL scripts without a live DB)
sqlalchemy.url = driver://user:pass@localhost/dbname  # overridden in env.py

[post_write_hooks]
# Automatically format new migration files with black
# Uncomment if black is available in the virtualenv:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
